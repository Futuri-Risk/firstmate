name: Fleet dependency evidence
# Broken experimental branch: automatic runs disabled to stop notification noise.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-dependency-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Build exact public dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@11.26.0
          bash tests/install-fleet-dependencies.sh "$RUNNER_TEMP/fleet-deps"
          cd "$RUNNER_TEMP/fleet-deps/sources/no-mistakes"
          go test ./internal/scm/gitea ./internal/e2e -run 'TestGiteaProviderJourney|TestHost|TestCreatePR' -count=1 -v | tee "$RUNNER_TEMP/gitea-provider.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-dependency-evidence
          path: |
            ${{ runner.temp }}/fleet-deps/source-pins.txt
            ${{ runner.temp }}/gitea-provider.log
          retention-days: 30
