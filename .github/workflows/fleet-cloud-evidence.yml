name: Fleet cloud evidence

on:
  push:
    branches: [feat/gitea-acpx-fleet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-cloud-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked candidate and public integration sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-evidence"
          git archive --format=tar.gz --output="$RUNNER_TEMP/fleet-evidence/firstmate.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/fleet-evidence/firstmate.sha"
          for repo in acpx zcode-acp no-mistakes treehouse; do
            git clone --quiet --depth=1 "https://github.com/Futuri-Risk/$repo.git" "$RUNNER_TEMP/$repo"
            git -C "$RUNNER_TEMP/$repo" rev-parse HEAD > "$RUNNER_TEMP/fleet-evidence/$repo.sha"
            git -C "$RUNNER_TEMP/$repo" archive --format=tar.gz --output="$RUNNER_TEMP/fleet-evidence/$repo.tar.gz" HEAD
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-source-evidence
          path: ${{ runner.temp }}/fleet-evidence/
          retention-days: 7
          if-no-files-found: error
