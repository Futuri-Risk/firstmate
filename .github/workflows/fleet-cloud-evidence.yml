name: Fleet cloud evidence

on:
  push:
    branches: [feat/gitea-acpx-fleet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-cloud-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Export pinned integration sources and executable test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-evidence/tools" "$RUNNER_TEMP/fleet-evidence/lib"
          git archive --format=tar.gz --output="$RUNNER_TEMP/fleet-evidence/firstmate.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/fleet-evidence/firstmate.sha"
          while read -r repo sha; do
            git init -q "$RUNNER_TEMP/$repo"
            git -C "$RUNNER_TEMP/$repo" remote add origin "https://github.com/Futuri-Risk/$repo.git"
            git -C "$RUNNER_TEMP/$repo" fetch -q --depth=1 origin "$sha"
            git -C "$RUNNER_TEMP/$repo" checkout -q --detach FETCH_HEAD
            git -C "$RUNNER_TEMP/$repo" rev-parse HEAD > "$RUNNER_TEMP/fleet-evidence/$repo.sha"
            git -C "$RUNNER_TEMP/$repo" archive --format=tar.gz --output="$RUNNER_TEMP/fleet-evidence/$repo.tar.gz" HEAD
          done <<'PINS'
          acpx 323191a80ff6dd72e51eb8636a0025d321415d96
          zcode-acp 6552c7d30554c72e6f69faacbff34d94366d9651
          no-mistakes 2c3a3013d2a221f4549d7fa7c458a11ef88023e5
          treehouse 99f4db2bbeececc1e6f136a88f79002e5a707174
          PINS
          npm --prefix "$RUNNER_TEMP/acpx" ci
          npm --prefix "$RUNNER_TEMP/acpx" run build
          tar -czf "$RUNNER_TEMP/fleet-evidence/acpx-runtime.tar.gz" -C "$RUNNER_TEMP/acpx" dist node_modules package.json
          npm install --prefix "$RUNNER_TEMP/tasks" --save-exact tasks-axi@0.2.4
          tar -czf "$RUNNER_TEMP/fleet-evidence/tasks-runtime.tar.gz" -C "$RUNNER_TEMP/tasks" .
          curl --fail --silent --show-error --location https://proxy.golang.org/gitea.dev/tea/@v/v0.16.0.zip -o "$RUNNER_TEMP/fleet-evidence/tea-source.zip"
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          cp "$(command -v tmux)" "$RUNNER_TEMP/fleet-evidence/tools/"
          cp -L /usr/lib/x86_64-linux-gnu/libevent_core-2.1.so.7 "$RUNNER_TEMP/fleet-evidence/lib/"
          ldd "$(command -v tmux)" > "$RUNNER_TEMP/fleet-evidence/tmux-libraries.txt"
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/fleet-evidence/tools"
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/fleet-evidence/tools"
          (cd "$RUNNER_TEMP/fleet-evidence" && sha256sum tools/* lib/* *.tar.gz tea-source.zip > checksums.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-source-evidence
          path: ${{ runner.temp }}/fleet-evidence/
          retention-days: 7
          if-no-files-found: error
