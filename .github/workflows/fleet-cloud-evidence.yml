name: Fleet cloud evidence
on:
  push:
    branches: [feat/gitea-acpx-fleet]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-cloud-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build pinned public test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-evidence/tools" "$RUNNER_TEMP/fleet-evidence/lib"
          git init -q "$RUNNER_TEMP/acpx"
          git -C "$RUNNER_TEMP/acpx" remote add origin https://github.com/Futuri-Risk/acpx.git
          git -C "$RUNNER_TEMP/acpx" fetch -q --depth=1 origin 323191a80ff6dd72e51eb8636a0025d321415d96
          git -C "$RUNNER_TEMP/acpx" checkout -q --detach FETCH_HEAD
          npm install -g pnpm@11.26.0
          pnpm --dir "$RUNNER_TEMP/acpx" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/acpx" run build
          tar -czf "$RUNNER_TEMP/fleet-evidence/acpx-runtime.tar.gz" -C "$RUNNER_TEMP/acpx" dist node_modules package.json pnpm-lock.yaml
          npm install --prefix "$RUNNER_TEMP/tasks" --save-exact tasks-axi@0.2.4
          tar -czf "$RUNNER_TEMP/fleet-evidence/tasks-runtime.tar.gz" -C "$RUNNER_TEMP/tasks" .
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          cp "$(command -v tmux)" "$RUNNER_TEMP/fleet-evidence/tools/"
          cp -L /usr/lib/x86_64-linux-gnu/libevent_core-2.1.so.7 "$RUNNER_TEMP/fleet-evidence/lib/"
          (cd "$RUNNER_TEMP/fleet-evidence" && sha256sum tools/* lib/* *.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-executable-dependencies
          path: ${{ runner.temp }}/fleet-evidence/
          retention-days: 7
          if-no-files-found: error
