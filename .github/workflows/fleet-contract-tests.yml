name: Fleet contract tests
on:
  push:
    branches: [feat/gitea-acpx-fleet]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fleet-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore pinned test dependency build
        uses: actions/cache@v4
        id: dependencies
        with:
          path: ${{ runner.temp }}/fleet-deps
          key: fleet-deps-v1-${{ runner.os }}-node22-${{ hashFiles('tests/install-fleet-dependencies.sh') }}
      - name: Build test dependencies when not cached
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@11.26.0
          bash tests/install-fleet-dependencies.sh "$RUNNER_TEMP/fleet-deps"
      - name: Prepare runtime and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/fleet-deps/complete"
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          echo "$RUNNER_TEMP/fleet-deps/tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/fleet-deps/tasks/node_modules/.bin" >> "$GITHUB_PATH"
          echo "FM_TEST_ZCODE_ENTRY=$RUNNER_TEMP/fleet-deps/sources/zcode-acp/dist/index.js" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fleet-results"
          cp "$RUNNER_TEMP/fleet-deps/source-pins.txt" "$RUNNER_TEMP/fleet-results/"
          git rev-parse HEAD > "$RUNNER_TEMP/fleet-results/head.txt"
      - name: Public behavior and native regression
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          python3 -m compileall -q bin || failed=1
          bash tests/fm-fleet-cloud.test.sh 2>&1 | tee "$RUNNER_TEMP/fleet-results/contracts.log" || failed=1
          mapfile -t subjects < <(find tests -maxdepth 1 -name '*.test.sh' | grep -E '/fm-(pr-check|pr-merge|pr-poll|tmux-agent-liveness|dispatch-resolve|quota-array-dispatch|control|busy-event)\.test\.sh$' | sort)
          if [ "${#subjects[@]}" -lt 3 ]; then
            echo 'Expected native regression subjects missing' >&2
            failed=1
          else
            bin/fm-test-run.sh "${subjects[@]}" --max-wall-ms 600000 2>&1 | tee "$RUNNER_TEMP/fleet-results/native-regression.log" || failed=1
          fi
          (cd "$RUNNER_TEMP/fleet-deps/sources/no-mistakes" && go test ./internal/scm/gitea ./internal/e2e -run 'TestGiteaProviderJourney|TestHost|TestCreatePR' -count=1 -v) 2>&1 | tee "$RUNNER_TEMP/fleet-results/no-mistakes-gitea.log" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-contract-test-results
          path: ${{ runner.temp }}/fleet-results/
          retention-days: 30
          if-no-files-found: warn
  report:
    needs: contracts
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fleet-contract-test-results
          path: results
      - name: Print bounded evidence; this summary is not a substitute for the test job
        shell: bash
        run: |
          set -euo pipefail
          cat results/head.txt
          for log in results/*.log; do
            printf '\n--- %s ---\n' "$log"
            tail -n 140 "$log"
          done
