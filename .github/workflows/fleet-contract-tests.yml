name: Fleet contract tests
on:
  push:
    branches: [feat/gitea-acpx-fleet, fix/fleet-onboarding-contracts]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fleet-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve exact tracked source for offline reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-source"
          git bundle create "$RUNNER_TEMP/fleet-source/firstmate.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD > "$RUNNER_TEMP/fleet-source/head.txt"
          (cd "$RUNNER_TEMP/fleet-source" && sha256sum firstmate.bundle > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-source
          path: ${{ runner.temp }}/fleet-source/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: fleet-executable-dependencies
          run-id: 35541552898
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fleet-dependencies
      - name: Verify and install test-only dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/fleet-dependencies"
          (cd "$dest" && sha256sum --check checksums.txt)
          chmod +x "$dest"/tools/*
          mkdir -p "$dest/acpx" "$dest/tasks" "$dest/zcode"
          tar -xzf "$dest/acpx-runtime.tar.gz" -C "$dest/acpx"
          tar -xzf "$dest/tasks-runtime.tar.gz" -C "$dest/tasks"
          tar -xzf "$dest/zcode-acp-runtime.tar.gz" -C "$dest/zcode"
          ln -s "$dest/acpx/dist/cli.js" "$dest/tools/acpx"
          chmod +x "$dest/acpx/dist/cli.js"
          echo "$dest/tools" >> "$GITHUB_PATH"
          echo "$dest/tasks/node_modules/.bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$dest/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "FM_TEST_ZCODE_ENTRY=$dest/zcode/dist/index.js" >> "$GITHUB_ENV"
      - name: Syntax and behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bin/fm_forge.py bin/fm-project-onboard.py bin/fm-gitea-labels.py bin/fm-captain-email.py bin/fm-acpx-worker.py
          bash -n tests/fm-fleet-cloud.test.sh
          bin/fm-test-run.sh --jobs 1 --per-script-timeout-secs 600 --json "$RUNNER_TEMP/fleet-timing.json" tests/fm-fleet-cloud.test.sh 2>&1 | tee "$RUNNER_TEMP/fleet-contract-tests.log"
      - name: Canonical lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bin/fm-lint.sh 2>&1 | tee "$RUNNER_TEMP/fleet-lint.log"
      - name: Test inventory and documentation coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          bin/fm-test-run.sh --check-coverage > "$RUNNER_TEMP/fleet-coverage.log" 2>&1 || failed=1
          bin/fm-doc-audience-check.sh >> "$RUNNER_TEMP/fleet-coverage.log" 2>&1 || failed=1
          cat "$RUNNER_TEMP/fleet-coverage.log"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-contract-test-results
          path: |
            ${{ runner.temp }}/fleet-contract-tests.log
            ${{ runner.temp }}/fleet-timing.json
            ${{ runner.temp }}/fleet-lint.log
            ${{ runner.temp }}/fleet-coverage.log
          retention-days: 7
