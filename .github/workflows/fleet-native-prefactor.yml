name: Fleet native seam prefactor
on:
  push:
    branches: [feat/gitea-acpx-fleet]
    paths: [.github/scripts/fleet-native-patch.py, .github/workflows/fleet-native-prefactor.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Futuri-Risk/firstmate' && github.ref == 'refs/heads/feat/gitea-acpx-fleet'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gitea-acpx-fleet
      - name: Apply checked changes on the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fleet-native-patch.py
          python3 -m py_compile bin/fm_forge.py bin/fm-captain-email.py tests/fm-captain-email.test.py
          git add bin/fm_forge.py bin/fm-captain-email.py tests/fm-captain-email.test.py .github/workflows/fleet-cloud-evidence.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(fleet): preserve structured command errors and native captain channel'
            git push origin HEAD:feat/gitea-acpx-fleet
          fi
          git rev-parse HEAD
